<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O quanto eu te amo?</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loveButton {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 999px;
      padding: 18px 30px;
      background: #ff4f9a;
      color: #fff;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255, 79, 154, .42);
      transition: transform .2s ease, opacity .2s ease;
    }

    #loveButton:hover { transform: translate(-50%, -50%) scale(1.06); }
    #loveButton:active { transform: translate(-50%, -50%) scale(.96); }
    #loveButton.hidden { opacity: 0; pointer-events: none; }

    .muito {
      position: fixed;
      z-index: 1;
      margin: 0;
      color: #ff4f9a;
      font-size: clamp(1.4rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: .08em;
      pointer-events: none;
      animation: appear 1.2s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.4) rotate(var(--rotation)); }
      to { opacity: 1; transform: scale(1) rotate(var(--rotation)); }
    }
  </style>
</head>
<body>
  <button id="loveButton" type="button">O quanto eu te amo?</button>

  <script>
    const button = document.querySelector('#loveButton');
    let animationStarted = false;

    button.addEventListener('click', () => {
      if (animationStarted) return;
      animationStarted = true;
      button.classList.add('hidden');

      let count = 0;
      const total = 100;
      const interval = setInterval(() => {
        const word = document.createElement('span');
        word.className = 'muito';
        word.textContent = 'MUITO';
        word.style.left = `${Math.random() * 86 + 2}%`;
        word.style.top = `${Math.random() * 88 + 2}%`;
        word.style.setProperty('--rotation', `${Math.random() * 24 - 12}deg`);
        word.style.color = `hsl(${330 + Math.random() * 20}, 100%, ${62 + Math.random() * 14}%)`;
        document.body.appendChild(word);

        count += 1;
        if (count === total) clearInterval(interval);
      }, 140);
    });
  </script>
</body>
</html>
